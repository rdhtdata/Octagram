<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Octagram Employee Portal - Internal Access & Authentication">
  <title>Employee Portal | Octagram</title>
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css?v=3.6">
  
  <style>
    :root {
      --login-card-bg: rgba(17, 48, 77, 0.75);
      --input-bg: rgba(12, 34, 55, 0.85);
      --input-border: rgba(255, 255, 255, 0.12);
      --input-focus: #38bdf8;
      --glow-color: rgba(56, 189, 248, 0.25);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 24px;
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(129, 140, 248, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, rgba(11, 27, 44, 0.95) 100%);
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: var(--font-sans);
    }

    /* Ambient cyber grid background */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      pointer-events: none;
      z-index: 0;
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-header .logo-box {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      margin-bottom: 12px;
    }

    .brand-header img {
      height: 38px;
      width: auto;
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.4));
    }

    .brand-header .company-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--accent-blue);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .security-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .login-card {
      background: var(--login-card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 
        0 20px 40px -15px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: border-color 0.3s ease;
    }

    .login-card:focus-within {
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: 
        0 20px 40px -15px rgba(0, 0, 0, 0.5),
        0 0 30px rgba(56, 189, 248, 0.12);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 13px 14px 13px 44px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .form-input::placeholder {
      color: rgba(148, 163, 184, 0.4);
    }

    .form-input:focus {
      border-color: var(--input-focus);
      background: rgba(15, 42, 68, 0.95);
      box-shadow: 0 0 0 3px var(--glow-color);
    }

    .form-input:focus + .input-icon,
    .form-group:focus-within .input-icon {
      color: var(--accent-blue);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.2s ease, background-color 0.2s ease;
    }

    .toggle-password:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
    }

    .toggle-password:focus {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }

    /* Error Alert */
    .alert-box {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 0.84rem;
      color: #fca5a5;
      animation: shake 0.35s ease;
    }

    .alert-box.active {
      display: flex;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 13px 20px;
      border-radius: 10px;
      border: none;
      background: var(--accent-gradient);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-submit .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .btn-submit.loading .spinner {
      display: inline-block;
    }

    .btn-submit.loading .btn-text {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .login-footer {
      margin-top: 24px;
      text-align: center;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 0.84rem;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--accent-blue);
    }

    .terminal-subtext {
      margin-top: 32px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <div class="login-container">
    <div class="brand-header">
      <a href="index.html" class="logo-box">
        <img src="images/Logo.svg" alt="Octagram Logo">
        <span class="company-title">Octagram</span>
      </a>
      <div>
        <span class="security-badge">
          <span class="dot"></span>
          AUTH SYSTEM // ENCRYPTED
        </span>
      </div>
    </div>

    <div class="login-card">
      <h1 class="card-title">Employee Portal</h1>
      <p class="card-subtitle">Sign in with your team credentials to access CRM</p>

      <div id="error-alert" class="alert-box" role="alert" aria-live="polite">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="error-text">Invalid username or password.</span>
      </div>

      <form id="employee-login-form" autocomplete="off">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-input" 
              placeholder="e.g. harsh" 
              required 
              autofocus
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="••••••••" 
              required
            >
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Toggle password visibility">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
          <span class="btn-text">Sign In to CRM</span>
          <span class="spinner"></span>
        </button>
      </form>

      <div class="login-footer">
        <a href="index.html" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back to Main Website
        </a>
      </div>
    </div>

    <div class="terminal-subtext">
      OCTAGRAM SECURE NODE // PORT 2026
    </div>
  </div>

  <script>
    // Configured Employee User Accounts
    const EMPLOYEE_CREDENTIALS = {
      'harsh': { password: 'founder123', name: 'Harsh', role: 'Founder' },
      'vishnu': { password: 'founder123', name: 'Vishnu', role: 'Founder' },
      'sanjana': { password: 'founder123', name: 'Sanjana', role: 'Founder' },
      'sumaiya': { password: 'outreach', name: 'Sumaiya', role: 'Outreach Specialist' }
    };

    const loginForm = document.getElementById('employee-login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const errorAlert = document.getElementById('error-alert');
    const errorText = document.getElementById('error-text');
    const submitBtn = document.getElementById('submit-btn');

    // Toggle password visibility
    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePasswordBtn.innerHTML = isPassword 
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
             <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
             <line x1="1" y1="1" x2="23" y2="23"></line>
           </svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
             <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
             <circle cx="12" cy="12" r="3"></circle>
           </svg>`;
    });

    // Clear error alert when user modifies inputs
    [usernameInput, passwordInput].forEach(input => {
      input.addEventListener('input', () => {
        errorAlert.classList.remove('active');
      });
    });

    // Form submission
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const username = usernameInput.value.trim().toLowerCase();
      const password = passwordInput.value.trim();

      const userRecord = EMPLOYEE_CREDENTIALS[username];

      if (userRecord && userRecord.password === password) {
        // Successful login
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;

        const authPayload = {
          username: username,
          name: userRecord.name,
          role: userRecord.role,
          authenticatedAt: new Date().toISOString()
        };

        sessionStorage.setItem('octagram_auth_user', JSON.stringify(authPayload));

        setTimeout(() => {
          window.location.href = 'crm.html';
        }, 400);
      } else {
        // Failed login
        errorText.textContent = 'Invalid username or password. Please try again.';
        errorAlert.classList.add('active');
        passwordInput.value = '';
        passwordInput.focus();
      }
    });

    // If user is already logged in, automatically forward to CRM
    const existingSession = sessionStorage.getItem('octagram_auth_user');
    if (existingSession) {
      try {
        const user = JSON.parse(existingSession);
        if (user && user.username) {
          window.location.replace('crm.html');
        }
      } catch (err) {
        sessionStorage.removeItem('octagram_auth_user');
      }
    }
  </script>
</body>
</html>
