<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bb-m-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24140a"/>
      <stop offset="100%" stop-color="#140b06"/>
    </linearGradient>
    <linearGradient id="bb-m-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="380" height="680" fill="url(#bb-m-bg)"/>

  <!-- Mobile Header -->
  <rect x="0" y="0" width="380" height="60" fill="#180e07"/>
  <circle cx="36" cy="30" r="14" fill="url(#bb-m-gold)"/>
  <text x="36" y="35" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#140b06" text-anchor="middle">B</text>
  <text x="60" y="36" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#fef3c7">Belaku Bakes</text>
  <!-- Hamburger -->
  <line x1="330" y1="24" x2="352" y2="24" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="330" y1="30" x2="352" y2="30" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="330" y1="36" x2="352" y2="36" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

  <!-- Hero Banner -->
  <g transform="translate(20, 80)">
    <rect width="130" height="22" rx="11" fill="#452714" stroke="#d97706" stroke-width="0.8"/>
    <text x="65" y="15" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#fef3c7" text-anchor="middle">HENNUR CLOUD KITCHEN</text>

    <text x="0" y="55" font-family="'Inter', serif" font-size="24" font-weight="800" fill="#ffffff">
      <tspan x="0" dy="0">Handcrafted Bakes,</tspan>
      <tspan x="0" dy="28" fill="#fde68a">Fresh to Order.</tspan>
    </text>

    <text x="0" y="115" font-family="'Inter', sans-serif" font-size="12" fill="#d4b8a5" line-height="1.4">
      Fudgy brownies, Basque cheesecakes, celebration cakes &amp; savory bakes in Bangalore.
    </text>

    <!-- WhatsApp Quick Order Button -->
    <g transform="translate(0, 150)">
      <rect width="340" height="42" rx="8" fill="url(#bb-m-gold)"/>
      <text x="170" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#140b06" text-anchor="middle">Order on WhatsApp →</text>
    </g>
  </g>

  <!-- Categories Scroll Row -->
  <g transform="translate(20, 290)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Popular Creations</text>
    
    <!-- Item 1 -->
    <g transform="translate(0, 15)">
      <rect width="340" height="90" rx="10" fill="#2d1a0f" stroke="#4a2c18"/>
      <rect x="12" y="12" width="66" height="66" rx="6" fill="#4a2c18"/>
      <text x="45" y="50" font-size="28" text-anchor="middle">🍫</text>
      <text x="90" y="34" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Belgian Fudgy Brownie</text>
      <text x="90" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#d4b8a5">Dark chocolate center</text>
      <text x="90" y="72" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f59e0b">Box of 4 / 6</text>
      <rect x="250" y="32" width="75" height="28" rx="6" fill="#4a2b16" stroke="#d97706" stroke-width="1"/>
      <text x="287" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#fde68a" text-anchor="middle">Enquire</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 115)">
      <rect width="340" height="90" rx="10" fill="#2d1a0f" stroke="#4a2c18"/>
      <rect x="12" y="12" width="66" height="66" rx="6" fill="#4a2c18"/>
      <text x="45" y="50" font-size="28" text-anchor="middle">🍰</text>
      <text x="90" y="34" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Basque Cheesecake</text>
      <text x="90" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#d4b8a5">Caramelized top, rich core</text>
      <text x="90" y="72" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f59e0b">500g / 1kg</text>
      <rect x="250" y="32" width="75" height="28" rx="6" fill="#4a2b16" stroke="#d97706" stroke-width="1"/>
      <text x="287" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#fde68a" text-anchor="middle">Enquire</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 215)">
      <rect width="340" height="90" rx="10" fill="#2d1a0f" stroke="#4a2c18"/>
      <rect x="12" y="12" width="66" height="66" rx="6" fill="#4a2c18"/>
      <text x="45" y="50" font-size="28" text-anchor="middle">🎂</text>
      <text x="90" y="34" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Celebration Cakes</text>
      <text x="90" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#d4b8a5">Custom birthday designs</text>
      <text x="90" y="72" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f59e0b">Custom weight</text>
      <rect x="250" y="32" width="75" height="28" rx="6" fill="#4a2b16" stroke="#d97706" stroke-width="1"/>
      <text x="287" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#fde68a" text-anchor="middle">Enquire</text>
    </g>
  </g>

  <!-- Mobile Bottom Sticky Bar -->
  <rect x="0" y="625" width="380" height="55" fill="#120803" stroke="#3d2010" stroke-width="1"/>
  <text x="30" y="657" font-family="'Inter', sans-serif" font-size="11" fill="#d4b8a5">📍 Hennur Road, Bangalore</text>
  <rect x="260" y="635" width="100" height="34" rx="6" fill="url(#bb-m-gold)"/>
  <text x="310" y="656" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#140b06" text-anchor="middle">WhatsApp</text>
</svg>
