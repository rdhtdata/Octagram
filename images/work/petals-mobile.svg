<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 680" width="100%" height="100%">
  <defs>
    <linearGradient id="pt-m-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14212e"/>
      <stop offset="100%" stop-color="#080e14"/>
    </linearGradient>
    <linearGradient id="pt-m-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
  </defs>

  <rect width="380" height="680" fill="url(#pt-m-bg)"/>

  <!-- Mobile Header -->
  <rect x="0" y="0" width="380" height="60" fill="#0c151e"/>
  <circle cx="34" cy="30" r="14" fill="url(#pt-m-gold)" opacity="0.25" stroke="#d4af37" stroke-width="1"/>
  <text x="34" y="35" font-family="'Inter', serif" font-size="13" font-weight="900" fill="#d4af37" text-anchor="middle">P</text>
  <text x="56" y="32" font-family="'Inter', serif" font-size="15" font-weight="700" fill="#ffffff">PETALS</text>
  <text x="56" y="44" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#d4af37">OPP. MANYATA TECH PARK</text>

  <rect x="290" y="16" width="75" height="28" rx="6" fill="url(#pt-m-gold)"/>
  <text x="327" y="34" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0c151e" text-anchor="middle">Book Stay</text>

  <!-- Mobile Hero -->
  <g transform="translate(20, 80)">
    <rect width="180" height="22" rx="11" fill="#1f3345" stroke="#d4af37" stroke-width="0.8"/>
    <text x="90" y="15" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#fef3c7" text-anchor="middle">2-MIN WALK TO MANYATA GATE</text>

    <text x="0" y="55" font-family="'Inter', serif" font-size="22" font-weight="800" fill="#ffffff">
      <tspan x="0" dy="0">A Quieter Stay in</tspan>
      <tspan x="0" dy="26" fill="#d4af37">Bangalore.</tspan>
    </text>

    <text x="0" y="115" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">
      Executive rooms, fiber Wi-Fi &amp; peaceful rest opposite Manyata Tech Park.
    </text>

    <!-- Instant Call / WhatsApp Booking -->
    <g transform="translate(0, 145)">
      <rect width="340" height="42" rx="8" fill="url(#pt-m-gold)"/>
      <text x="170" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0c151e" text-anchor="middle">WhatsApp Direct Booking →</text>
    </g>
  </g>

  <!-- Room Cards -->
  <g transform="translate(20, 285)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#d4af37" letter-spacing="0.5">AVAILABLE ROOMS &amp; SUITES</text>

    <!-- Room 1 -->
    <g transform="translate(0, 15)">
      <rect width="340" height="96" rx="8" fill="#162737" stroke="#d4af37" stroke-width="1"/>
      <rect x="12" y="12" width="72" height="72" rx="6" fill="#243a50"/>
      <text x="48" y="54" font-size="28" text-anchor="middle">🛏️</text>
      <text x="96" y="32" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Deluxe Room</text>
      <text x="96" y="50" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">King bed, rain shower, silent AC</text>
      <text x="96" y="74" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#d4af37">₹4,499 / night</text>
      <rect x="250" y="52" width="78" height="28" rx="6" fill="url(#pt-m-gold)"/>
      <text x="289" y="70" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0c151e" text-anchor="middle">Book Now</text>
    </g>

    <!-- Room 2 -->
    <g transform="translate(0, 120)">
      <rect width="340" height="96" rx="8" fill="#162737" stroke="#253e56"/>
      <rect x="12" y="12" width="72" height="72" rx="6" fill="#243a50"/>
      <text x="48" y="54" font-size="28" text-anchor="middle">🛋️</text>
      <text x="96" y="32" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Signature Suite Room</text>
      <text x="96" y="50" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Living lounge, executive desk</text>
      <text x="96" y="74" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#d4af37">Executive Choice</text>
      <rect x="250" y="52" width="78" height="28" rx="6" fill="#22394f" stroke="#d4af37" stroke-width="1"/>
      <text x="289" y="70" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#fef3c7" text-anchor="middle">Inquire</text>
    </g>

    <!-- Room 3 -->
    <g transform="translate(0, 225)">
      <rect width="340" height="96" rx="8" fill="#162737" stroke="#253e56"/>
      <rect x="12" y="12" width="72" height="72" rx="6" fill="#243a50"/>
      <text x="48" y="54" font-size="28" text-anchor="middle">💼</text>
      <text x="96" y="32" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Superior Room</text>
      <text x="96" y="50" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Queen bed, work desk &amp; smart TV</text>
      <text x="96" y="74" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#d4af37">Solo Traveler</text>
      <rect x="250" y="52" width="78" height="28" rx="6" fill="#22394f" stroke="#d4af37" stroke-width="1"/>
      <text x="289" y="70" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#fef3c7" text-anchor="middle">Inquire</text>
    </g>
  </g>

  <!-- Mobile Bottom Sticky Bar -->
  <rect x="0" y="625" width="380" height="55" fill="#080e14" stroke="#253849" stroke-width="1"/>
  <text x="20" y="657" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Desk: +91 8123698844</text>
  <rect x="250" y="635" width="110" height="34" rx="6" fill="#25d366"/>
  <text x="305" y="656" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">💬 Chat Stay</text>
</svg>
