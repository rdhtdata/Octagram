<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="rk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#050c18"/>
    </linearGradient>
    <linearGradient id="rk-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#0c182d"/>
    </linearGradient>
    <linearGradient id="rk-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="rk-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#rk-bg)"/>

  <!-- Tech Grid / Blueprint lines -->
  <g opacity="0.07" stroke="#00f2fe" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="700"/>
    <line x1="400" y1="0" x2="400" y2="700"/>
    <line x1="600" y1="0" x2="600" y2="700"/>
    <line x1="800" y1="0" x2="800" y2="700"/>
    <line x1="1000" y1="0" x2="1000" y2="700"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="1000" cy="200" r="260" fill="#00f2fe" opacity="0.08" filter="blur(60px)"/>

  <!-- Top Navbar -->
  <rect x="0" y="0" width="1200" height="75" fill="#081426" opacity="0.95"/>
  <line x1="0" y1="75" x2="1200" y2="75" stroke="#1b3052" stroke-width="1"/>

  <!-- Logo -->
  <g transform="translate(60, 22)">
    <rect width="32" height="32" rx="6" fill="#00f2fe" opacity="0.2" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="16" y="22" font-family="'Inter', monospace" font-size="16" font-weight="900" fill="#00f2fe" text-anchor="middle">⚗</text>
    <text x="44" y="19" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.5">RANKA CHEMICAL</text>
    <text x="44" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64ffda" letter-spacing="1.5">MOLECULES THAT MATTER</text>
  </g>

  <!-- Nav Links -->
  <g transform="translate(560, 44)" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#8892b0">
    <text x="0" y="0" fill="#64ffda" font-weight="600">Home</text>
    <text x="65" y="0">About Us</text>
    <text x="145" y="0">Catalogue (5 Pillars)</text>
    <text x="300" y="0">Our Promise (COA/MSDS)</text>
    <text x="480" y="0">Contact</text>
  </g>

  <!-- Inquiry Cart & Quote CTA -->
  <g transform="translate(1030, 20)">
    <rect width="120" height="36" rx="6" fill="url(#rk-cyan)"/>
    <text x="60" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0a192f" text-anchor="middle">Request Quote (0)</text>
  </g>

  <!-- Hero Content Left -->
  <g transform="translate(70, 135)">
    <!-- Authorized Stockist Badge -->
    <rect width="260" height="28" rx="14" fill="#0f314d" stroke="#00f2fe" stroke-width="1"/>
    <text x="130" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#64ffda" text-anchor="middle" letter-spacing="0.8">AUTHORIZED STOCKIST • SD FINE CHEM</text>

    <!-- Main Headline -->
    <text x="0" y="85" font-family="'Inter', sans-serif" font-size="44" font-weight="800" fill="#ffffff" line-height="1.15">
      <tspan x="0" dy="0">High-Purity Chemicals</tspan>
      <tspan x="0" dy="52" fill="#00f2fe">&amp; Laboratory Equipment</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="195" font-family="'Inter', sans-serif" font-size="15" fill="#8892b0" line-height="1.6">
      <tspan x="0" dy="0">Compliant B2B distribution of analytical reagents, pharmaceutical raw materials,</tspan>
      <tspan x="0" dy="24">bulk solvents, borosilicate glassware and filtration media for research and industry.</tspan>
    </text>

    <!-- Action Buttons -->
    <g transform="translate(0, 255)">
      <rect width="190" height="46" rx="8" fill="url(#rk-cyan)"/>
      <text x="95" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0a192f" text-anchor="middle">Browse Catalogue →</text>
      
      <g transform="translate(210, 0)">
        <rect width="190" height="46" rx="8" fill="#112240" stroke="#233554" stroke-width="1.5"/>
        <text x="95" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#64ffda" text-anchor="middle">Build Custom Quote</text>
      </g>
    </g>

    <!-- Compliance Strip -->
    <g transform="translate(0, 345)" font-family="'Inter', sans-serif" font-size="12" fill="#ccd6f6">
      <g transform="translate(0, 0)">
        <rect width="165" height="48" rx="8" fill="#0d213a" stroke="#1b3a5b"/>
        <text x="14" y="22" font-weight="700" fill="#64ffda">100% Traceability</text>
        <text x="14" y="38" font-size="10" fill="#8892b0">COA &amp; MSDS per batch</text>
      </g>

      <g transform="translate(180, 0)">
        <rect width="165" height="48" rx="8" fill="#0d213a" stroke="#1b3a5b"/>
        <text x="14" y="22" font-weight="700" fill="#64ffda">Direct Factory Supply</text>
        <text x="14" y="38" font-size="10" fill="#8892b0">Competitive B2B Pricing</text>
      </g>

      <g transform="translate(360, 0)">
        <rect width="165" height="48" rx="8" fill="#0d213a" stroke="#1b3a5b"/>
        <text x="14" y="22" font-weight="700" fill="#64ffda">Controlled Storage</text>
        <text x="14" y="38" font-size="10" fill="#8892b0">Bengaluru Distribution Hub</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Showcase: 5 Catalogue Pillars -->
  <g transform="translate(730, 115)" filter="url(#rk-shadow)">
    <!-- Header of catalogue pill selector -->
    <rect width="400" height="480" rx="14" fill="url(#rk-card)" stroke="#233554" stroke-width="1.5"/>
    <rect x="0" y="0" width="400" height="45" rx="14" fill="#0b1b33"/>
    <text x="20" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">CHEMICAL CATALOGUE DISCOVERY</text>
    <circle cx="375" cy="22" r="4" fill="#10b981"/>

    <!-- Pillar 1 -->
    <g transform="translate(15, 60)">
      <rect width="370" height="72" rx="8" fill="#172a45" stroke="#00f2fe" stroke-width="1"/>
      <text x="20" y="32" font-family="'Inter', sans-serif" font-size="18">🧪</text>
      <text x="50" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Laboratory Chemicals &amp; Reagents</text>
      <text x="50" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#8892b0">AR/GR Grade, LR, Biochemicals, NMR Solvents</text>
      <text x="325" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#00f2fe">RFQ →</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(15, 142)">
      <rect width="370" height="72" rx="8" fill="#112240" stroke="#1d3557"/>
      <text x="20" y="32" font-family="'Inter', sans-serif" font-size="18">💊</text>
      <text x="50" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Pharmaceutical Raw Materials</text>
      <text x="50" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#8892b0">APIs, IP/BP/USP Excipients, HPLC Solvents</text>
      <text x="325" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#8892b0">RFQ →</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(15, 224)">
      <rect width="370" height="72" rx="8" fill="#112240" stroke="#1d3557"/>
      <text x="20" y="32" font-family="'Inter', sans-serif" font-size="18">🛢️</text>
      <text x="50" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Industrial &amp; Bulk Chemicals</text>
      <text x="50" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#8892b0">IPA, Acetone, MIBK, Bulk Acids &amp; Bases</text>
      <text x="325" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#8892b0">RFQ →</text>
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(15, 306)">
      <rect width="370" height="72" rx="8" fill="#112240" stroke="#1d3557"/>
      <text x="20" y="32" font-family="'Inter', sans-serif" font-size="18">🥛</text>
      <text x="50" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Labware &amp; Glassware</text>
      <text x="50" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#8892b0">Class A Volumetric Flasks, Borosilicate Beakers</text>
      <text x="325" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#8892b0">RFQ →</text>
    </g>

    <!-- Pillar 5 -->
    <g transform="translate(15, 388)">
      <rect width="370" height="72" rx="8" fill="#112240" stroke="#1d3557"/>
      <text x="20" y="32" font-family="'Inter', sans-serif" font-size="18">📄</text>
      <text x="50" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Filter Paper &amp; Separation Media</text>
      <text x="50" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#8892b0">Ashless Filter Circles, PTFE Syringe Filters, TLC</text>
      <text x="325" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#8892b0">RFQ →</text>
    </g>
  </g>

  <!-- Bottom Strip -->
  <rect x="0" y="660" width="1200" height="40" fill="#040b15"/>
  <text x="60" y="684" font-family="'Inter', sans-serif" font-size="12" fill="#64ffda">📍 Southern India B2B Distribution Hub • Bengaluru • Instant WhatsApp Quotations: +91 9071266066</text>
</svg>
